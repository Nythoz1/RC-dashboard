<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Engines in Stock — Rollin Coal · Canada's Diesel Engine Specialists</title>
<meta name="description" content="Diesel engines in stock now at Rollin Coal, Medicine Hat AB. Caterpillar, Cummins, Detroit, Paccar and more — remanufactured and good-running takeouts, shipped Canada-wide."/>
<meta property="og:title" content="Engines in Stock — Rollin Coal"/>
<meta property="og:description" content="Live inventory of diesel engines. Call 1-587-863-0505."/>
<!--
  PUBLIC page: reads the stock_public view (buyer-safe fields only) with the
  publishable key. No login, no internal data. Served at /stock.html.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Mono',monospace;color:#e8e4de;background:radial-gradient(900px 380px at 50% -140px,rgba(255,106,32,.12),transparent 70%),#0a0a0a;min-height:100vh;}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-bottom:1px solid #2a2a2a;background:linear-gradient(180deg,#181818,#0d0d0e);flex-wrap:wrap;}
.hl{display:flex;align-items:center;gap:12px;}
.hi{width:46px;height:46px;background:linear-gradient(135deg,#ff7a2e,#d4581a);border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:#fff;box-shadow:0 6px 18px -4px rgba(255,106,32,.6);}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:25px;letter-spacing:3px;text-transform:uppercase;line-height:1;}
.hs{font-size:9px;color:#d4581a;letter-spacing:3px;text-transform:uppercase;font-weight:600;margin-top:3px;}
.call{padding:11px 18px;border-radius:10px;background:linear-gradient(135deg,#ff7a2e,#d4581a);color:#fff;text-decoration:none;font-weight:700;font-size:13px;box-shadow:0 6px 16px -6px rgba(255,106,32,.6);white-space:nowrap;}
.bar{max-width:1200px;margin:0 auto;padding:22px 20px 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.bar h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:2.5px;text-transform:uppercase;}
.bar .n{font-size:11px;color:#8a8579;}
.grid{max-width:1200px;margin:0 auto;padding:14px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
.card{background:linear-gradient(160deg,#181a1e,#131417);border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;transition:transform .15s,border-color .15s;}
.card:hover{transform:translateY(-3px);border-color:#3a3a3a;}
.ph{width:100%;height:160px;object-fit:cover;display:block;background:#101113;}
.ph.none{display:flex;align-items:center;justify-content:center;font-size:38px;color:#2c2c2c;}
.bd{padding:13px 15px 15px;}
.nm{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;line-height:1.1;}
.esn{font-size:9.5px;color:#8a8579;margin-top:3px;}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.chip{font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;color:#8a8579;border:1px solid #2a2a2a;border-radius:10px;padding:2px 8px;}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px;}
.price{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:24px;color:#ff905c;}
.cta{font-size:9px;color:#6fd98a;border:1px solid #3a9a4f;border-radius:10px;padding:3px 9px;text-decoration:none;white-space:nowrap;}
.state{max-width:1200px;margin:0 auto;padding:60px 20px;text-align:center;color:#5a5650;font-size:13px;}
.foot{border-top:1px solid #2a2a2a;padding:18px 22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:#5a5650;}
@media(max-width:560px){h1{font-size:20px}.call{padding:9px 13px;font-size:11px}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hl"><div class="hi">RC</div><div><h1>Rollin Coal</h1><div class="hs">Canada's Diesel Engine Specialists</div></div></div>
  <a class="call" href="tel:1-587-863-0505">📞 1-587-863-0505</a>
</header>
<div class="bar"><h2>Engines in Stock</h2><span class="n" id="count">loading…</span><span class="n" style="margin-left:auto">Updated live · shipped Canada-wide</span></div>
<div class="grid" id="grid"></div>
<div class="state" id="state">Loading inventory…</div>
<footer class="foot">
  <span>Rollin Coal · 2040 11th Ave NW, Medicine Hat, AB</span>
  <span>rollin-coal.ca · 1-587-863-0505</span>
</footer>
<script>
(function(){
  var URL="https://ssvcappeflsgickdzmpw.supabase.co/rest/v1/stock_public?select=*&order=price.desc";
  var KEY="sb_publishable_My_YTwDPHQRg9R5uR1SR8g_XNuu_s2W";
  var grid=document.getElementById("grid"),state=document.getElementById("state"),count=document.getElementById("count");
  function esc(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;}
  function money(n){return "$"+Number(n||0).toLocaleString("en-US");}
  fetch(URL,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).then(function(rows){
    if(!rows||!rows.length){state.textContent="Nothing listed right now — call us, inventory moves fast.";count.textContent="";return;}
    state.style.display="none";count.textContent=rows.length+" engine"+(rows.length>1?"s":"")+" available now";
    grid.innerHTML=rows.map(function(e){
      var img=e.photo?'<img class="ph" src="'+esc(e.photo)+'" alt="'+esc(e.name)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;ph none&quot;>🔧</div>\'">':'<div class="ph none">🔧</div>';
      var chips="";
      if(e.year)chips+='<span class="chip">'+esc(e.year)+'</span>';
      if(e.rated_hp)chips+='<span class="chip">'+esc(e.rated_hp)+' HP</span>';
      if(e.condition)chips+='<span class="chip">'+esc(e.condition)+'</span>';
      return '<div class="card">'+img+'<div class="bd"><div class="nm">'+esc(e.name)+'</div><div class="esn">'+(e.esn?("ESN "+esc(e.esn)+" · "):"")+esc(e.sku||"")+'</div><div class="chips">'+chips+'</div><div class="pr"><span class="price">'+(e.price>0?money(e.price):"Call")+'</span><a class="cta" href="tel:1-587-863-0505">Call to buy →</a></div></div></div>';
    }).join("");
  }).catch(function(err){state.textContent="Couldn't load inventory — please call 1-587-863-0505.";console.error(err);});
})();
</script>
</body>
</html>
