<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The customer's quote page (migration 0018, src/quote/main.js). Public, but it shows only the one
     quote its link's token opens; the dashboard stays behind its login. -->
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Your quote</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f2ec;--sf:#fff;--sf2:#f8f6f1;--ln:#ddd8cf;--tx:#1a1a1a;--tx2:#3d3a35;--mt:#5f5a52;--act:#b0430c;--acb:#b5470f;--acbh:#9a3c0c;--g:#1e7a34;--gs:#e5f3e8;--r:#b3261e;--rs:#fbe9e7;
  --fb:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--fd:"Barlow Condensed","Arial Narrow",sans-serif;--fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:16px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
[hidden]{display:none!important}
.shop{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.logo{width:48px;height:48px;border-radius:10px;background:var(--acb);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:1px;flex:none}
.shop h1{font-family:var(--fd);font-weight:700;font-size:28px;line-height:1.05;margin:0;letter-spacing:.5px}
.shop .tag{color:var(--mt);font-size:14px}
.contact{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14.5px;margin:-8px 0 18px}
.contact a{color:var(--act);text-decoration:none;font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:18px;margin-bottom:14px}
.kick{font-family:var(--fm);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mt)}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.qnum{font-family:var(--fd);font-weight:700;font-size:26px;letter-spacing:.5px}
.for{font-size:15px;color:var(--tx2)}
.desc{margin:12px 0 4px;font-size:16px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
th{font-family:var(--fm);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mt);font-weight:500;text-align:right;padding:6px 0;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 0;border-bottom:1px solid var(--ln);text-align:right;vertical-align:top;font-size:15px}
td.n{font-family:var(--fm);white-space:nowrap;padding-left:12px}
.tot{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.tot span:nth-child(even){font-family:var(--fm);text-align:right}
.tot .big{font-family:var(--fd);font-weight:700;font-size:24px;color:var(--act)}
.tot .bign{font-family:var(--fm);font-weight:600;font-size:22px;color:var(--act);text-align:right}
.valid{color:var(--mt);font-size:14px;margin-top:10px}
.state{border-radius:12px;padding:16px 18px;margin-bottom:14px;font-size:16px}
.state.ok{background:var(--gs);border:1px solid var(--g)}
.state.no{background:var(--rs);border:1px solid var(--r)}
.state b{display:block;font-family:var(--fd);font-size:22px;letter-spacing:.5px}
label{display:block;font-weight:600;font-size:14.5px;margin:12px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--sf2);color:var(--tx)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acb) 45%,transparent);outline-offset:1px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:700;font-size:16px;border-radius:10px;padding:13px 18px;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}
button.go{background:var(--acb);border-color:var(--acb);color:#fff;flex:1;min-width:200px}
button.go:hover{background:var(--acbh)}
button:disabled{opacity:.55;cursor:not-allowed}
.why{color:var(--mt);font-size:14px;margin-top:8px}
.err{color:var(--r);font-weight:600;margin-top:10px}
.small{font-size:13.5px;color:var(--mt);margin-top:18px;text-align:center}
.small button{padding:6px 12px;font-size:14px;font-weight:600}
@media print{.noprint{display:none!important}body{background:#fff}.card{border:none;padding:0}}
@media (prefers-reduced-motion:no-preference){.state{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}}
</style>
</head><body>
<main id="app" aria-live="polite"><p class="kick">Loading your quote…</p></main>
<script type="module" src="/src/quote/main.js"></script>
</body></html>
